<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shows</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <h1>All Shows</h1>
    <table class="shows-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Network</th>
          <th>Release Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for show in shows %}
        <tr>
          <td>{{ show.id }}</td>
          <td>{{ show.title }}</td>
          <td>{{ show.network }}</td>
          <td>{{ show.release_date }}</td>
          <td>
            <a href="/shows/{{ show.id }}/" class="btn-view">View</a>
            <a href="/shows/{{ show.id }}/edit/" class="btn-edit">Edit</a>
            <a
              href="/shows/{{ show.id }}/destroy/"
              class="btn-delete"
              onclick="return confirm('Are you sure?');"
              >Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a class="btn-add" href="/shows/new/"> Add New Show </a>
  </body>
</html>
