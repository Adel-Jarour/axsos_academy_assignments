<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Show</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <a class="btn-back" href="/shows/">Go Back</a>
    <div class="container">
      <h1>Add a New Show</h1>

      <form action="/shows/new/" method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" value="{{ data.title }}" />
        </div>

        <div class="form-group">
          <label>Network</label>
          <input type="text" name="network" value="{{ data.network }}" />
        </div>

        <div class="form-group">
          <label>Release Date</label>
          <input type="date" name="release_date" value="{{ data.release_date }}" />
        </div>

        <div class="form-group">
          <label>Description</label>

          <!-- This for avoid format text area line when save the cahnges, to avoid the white space at beginning. -->
          <!-- prettier-ignore -->
          <textarea name="description" rows="5">{{ data.description }}</textarea>
        </div>

        {% for key, value in errors.items %}
        <span class="error-text">{{ value }}</span>
        {% endfor %}

        <button type="submit" class="btn-add">Create</button>
      </form>
    </div>
  </body>
</html>
