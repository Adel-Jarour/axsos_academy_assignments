<!doctype html>
<html>
  <head>
    <title>Edit {{ show.title }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <a href="/shows/" class="btn-back">Go Back</a>

    <div class="container">
      <h1>Edit Show</h1>

      <form action="/shows/{{ show.id }}/update/" method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" value="{{ show.title }}" required />
        </div>

        <div class="form-group">
          <label>Network</label>
          <input
            type="text"
            name="network"
            value="{{ show.network }}"
            required
          />
        </div>

        <div class="form-group">
          <label>Release Date</label>
          <input
            type="date"
            name="release_date"
            value="{{ show.release_date|date:'Y-m-d' }}"
            required
          />
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea name="description" rows="5" required>
          {{ show.description }}
          </textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-update">Update</button>
        </div>
      </form>

      <a href="/shows/{{ show.id }}" class="btn-back">Go Show</a>
    </div>
  </body>
</html>
